<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <header>
      <h1>User Management Dashboard</h1>
      <p>Simulating API Data Fetching</p>
      
      <div class="controls">
        <button id="load-btn" class="primary-btn">Load Users</button>
        <button id="clear-btn" class="secondary-btn">Clear Data</button>
      </div>
    </header>

    <main id="data-display" class="data-grid">
      <p class="placeholder-text">Click "Load Users" to fetch data from the API.</p>
    </main>
  </div>

  <script src="dashboard_project.js"></script>
</body>
</html>
